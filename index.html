<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Modawaa · مداواة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="p-shell">
  <header class="p-head"><div class="inner">
    <span class="brand"><span class="logo">م</span><span id="brand">مداواة</span></span>
    <a href="#" id="langbtn">English</a>
  </div></header>
  <main class="p-main">
    <div class="card appt" id="appt" hidden style="margin-bottom:1rem">
      <div><span class="muted small" data-t="with_doctor"></span><strong id="docname"></strong><span class="muted small" id="docspec"></span></div>
      <div><span class="muted small" data-t="at"></span><strong dir="ltr" style="text-align:start" id="when"></strong></div>
    </div>

    <!-- 0. connecting to the clinic -->
    <section class="card narrow step center" id="s-connect">
      <div class="pulse"></div>
      <h2 data-t="connect_heading"></h2>
      <p class="muted" id="connectmsg" data-t="connect_help"></p>
    </section>

    <!-- message (invalid / expired / ended ...) -->
    <section class="card narrow step center" id="s-msg" hidden><p id="msg" style="font-size:1.1rem;margin:0"></p></section>

    <!-- 1. verify -->
    <form class="card narrow step" id="s-verify" hidden>
      <h2 data-t="verify_heading"></h2>
      <p class="muted" data-t="verify_help"></p>
      <div class="alert" id="verr" hidden style="margin-bottom:1rem"></div>
      <div class="field"><label for="dd" data-t="dob"></label>
        <div class="dob" dir="ltr">
          <div><input id="dd" inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2" placeholder="DD" required autocomplete="bday-day"><span data-t="day"></span></div>
          <div><input id="mm" inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2" placeholder="MM" required autocomplete="bday-month"><span data-t="month"></span></div>
          <div><input id="yy" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="YYYY" required autocomplete="bday-year"><span data-t="year"></span></div>
        </div>
        <p class="small muted" style="margin:.4rem 0 0" data-t="dob_hint"></p>
      </div>
      <div class="field"><button class="btn big" type="submit" id="vbtn" style="width:100%;justify-content:center" data-t="continue"></button></div>
    </form>

    <!-- 2. consent -->
    <section class="card narrow step" id="s-consent" hidden>
      <h2 data-t="consent_heading"></h2>
      <p data-t="consent_text"></p>
      <button class="btn big" id="agree" style="width:100%;justify-content:center" data-t="consent_agree"></button>
    </section>

    <!-- 3. device check -->
    <section class="card narrow step center" id="s-device" hidden>
      <h2 data-t="device_heading"></h2>
      <p class="muted" data-t="device_help"></p>
      <video class="preview" id="preview" autoplay playsinline muted></video>
      <p id="devmsg"></p>
      <div class="row" style="justify-content:center">
        <button class="btn secondary" id="retry" hidden data-t="retry"></button>
        <button class="btn big" id="enter" disabled data-t="enter_waiting"></button>
      </div>
    </section>

    <!-- 4. waiting -->
    <section class="card narrow step center" id="s-wait" hidden>
      <div class="pulse"></div>
      <h2 data-t="waiting_heading"></h2>
      <p class="muted" data-t="waiting_help"></p>
    </section>

    <!-- 5. call -->
    <section class="step" id="s-call" hidden>
      <div class="call">
        <video class="remote" id="remote" autoplay playsinline></video>
        <video class="local" id="local" autoplay playsinline muted></video>
        <div class="overlay" id="overlay"></div>
      </div>
      <div class="controls">
        <button class="btn secondary" id="mic" data-t="mute"></button>
        <button class="btn secondary" id="cam" data-t="cam_off"></button>
        <button class="btn secondary" id="chatbtn" data-t="chat"></button>
        <button class="btn danger" id="leave" data-t="leave"></button>
      </div>
      <div class="card chat" id="chatbox" hidden style="margin-top:1rem">
        <div class="log" id="chatlog"></div>
        <form id="chatform"><input id="chatin" maxlength="1000"><button class="btn" data-t="send"></button></form>
      </div>
    </section>
  </main>
  <footer class="p-foot" data-t="footer"></footer>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
